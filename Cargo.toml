[package]
name = "task-tracke-rs"
version = "0.1.1"
edition = "2024"
description = "A command-line task tracker with short ids, repeating tasks, and undo and redo."
license = "MIT OR Apache-2.0"
repository = "https://github.com/meihapps/task-tracke-rs"
readme = "README.md"
keywords = ["todo", "task", "cli", "undo", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
dirs = "6.0.0"
humantime = "2.4.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
u4 = { version = "0.1.2", features = ["serde"] }

[[bin]]
name = "todo"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
